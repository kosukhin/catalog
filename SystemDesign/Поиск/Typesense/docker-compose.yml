services:
  typesense:
    image: typesense/typesense:27.1
    restart: no
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
      - TYPESENSE_DATA_DIR=/data
    command: "--data-dir /data --api-key ${TYPESENSE_API_KEY:-xyz}"

  backend:
    build: ./backend
    restart: no
    ports:
      - "3000:3000"
    environment:
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_PROTOCOL=http
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
    depends_on:
      - typesense
    volumes:
      - model_cache:/root/.cache

volumes:
  typesense_data:
  model_cache:
