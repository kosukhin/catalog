# Имя проекта задано явно: каталог называется по-русски, и compose не может
# вывести из него корректное имя проекта (получилось бы пустое).
name: postgres-isolation-levels

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-isolation-levels
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
    ports:
      # На хосте 5433, чтобы не конфликтовать с локальным PostgreSQL на 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты из sql/ выполняются один раз при создании тома — по алфавиту.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
