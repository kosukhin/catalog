name: redis-pubsub-chat

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app1:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy

  # Второй инстанс того же приложения — чтобы показать горизонтальное
  # масштабирование: подписчики на разных серверах получают сообщения
  # через один Redis Pub/Sub.
  app2:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3002
    ports:
      - "3003:3002"
    depends_on:
      redis:
        condition: service_healthy
